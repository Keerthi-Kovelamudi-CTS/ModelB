# Per-cancer config for contrast_report. Copy this for a new cancer and edit the ⚙ fields.
cancer: lung
organ: lung                       # ⚙ organ word shown in labels/narratives

# Operating point + horizon — auto-derived from the run if left null.
threshold: null                   # null → read modeling/operating_threshold_{h}.json, else 0.50
gap_months: null                  # null → parse from the stable-matrix filename {h} (e.g. 12mo → 12)

# Data source (shared EMIS; swap only for a different project/dataset)
bq_project: prj-cts-ai-dev-sp

# Raw-events cache used for anchors + the model-window column (⚙ run-specific)
cache_uri: gs://gcs-ai-dev-model-artifacts/keerthi/Lung_Cancer/raw_events/Astra_10yr_7k_withtext_internal.parquet

# ⚙ Cancer-workup detector (D-organ). Generic oncology core is always included;
# these are the organ-specific add-on terms (case-insensitive regex fragments).
workup_terms: |-
  refer\w*.*(chest|respirat|thorac|medicine|medical service)|referral to (respiratory|chest)|
  chest x-?ray|standard chest|chest clinic|seen in chest|
  respiratory (physician|medicine|clinic)|seen by respiratory|
  bronchoscop|lobectomy|thoracoscop|pleural (asp|effusion|biopsy)|
  lung (nodule|mass|cancer|lesion)|nodule of lung|solitary (pulmonary )?nodule|
  (ct|computed tomog).*(chest|thorax)

# ⚙ Organ-relevant highlighter (orange chips) — organ + its symptoms/tests
relevant_terms: |-
  cough|h[ae]emoptysis|chest|pneumon|respirat|dyspn|breath|spo2|oxygen sat|copd|bronch|lung|
  pleur|wheez|lrti|sputum|hoarse|x-?ray|\bct\b|spiromet|smok|nodule|thoracic

# ⚙ Look-alike profile (FP "why flagged" narrative)
lookalike: older ex-smoker / COPD
